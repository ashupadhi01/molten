<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>molten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2ee;
      --surface: #ffffff;
      --border: #e0d9d0;
      --text: #1a1612;
      --dim: #a09a92;
      --accent: #6b5742;
      --accent-hover: #7d6852;
      --accent-dim: #544434;
      --error: #cc2200;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    [data-theme="dark"] {
      --bg: #262220;
      --surface: #2e2a27;
      --border: #3d3733;
      --text: #e8e1d6;
      --dim: #8a8077;
      --accent: #c8c2ba;
      --accent-hover: #d8d3cb;
      --accent-dim: #a89f93;
      --error: #ff6b4a;
      --shadow: 0 2px 18px rgba(0,0,0,0.45);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 80px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 48px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    header h1 {
      font-family: var(--display);
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    header span {
      font-size: 0.8rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .theme-toggle {
      margin-left: auto;
      align-self: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .input-box {
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 1rem;
      padding: 0;
      resize: none;
      min-height: 52px;
      max-height: 350px;
      line-height: 1.5;
      overflow-y: auto;
      field-sizing: content;
    }

    textarea::placeholder { color: var(--dim); }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 4px;
    }

    .actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .icon-btn:hover {
      background: var(--bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.recording {
      background: var(--error);
      color: #fff;
      border-color: var(--error);
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(204, 34, 0, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(204, 34, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(204, 34, 0, 0); }
    }

    .run-btn {
      margin: 0;
      height: 38px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0 20px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .run-btn:hover { background: var(--accent-hover); }
    .run-btn:active { transform: scale(0.97); }
    .run-btn:disabled { background: var(--dim); cursor: not-allowed; transform: none; color: #fff; opacity: 0.5; }

    .output-area {
      padding: 24px;
      min-height: 180px;
      position: relative;
    }

    .output-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 14px;
    }

    #output {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
    }

    #output.empty::before {
      content: 'output appears here…';
      color: var(--dim);
      font-style: italic;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .status-bar {
      border-top: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.3s;
    }
    .dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.error  { background: var(--error); }

    #status-text {
      font-size: 0.8rem;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    .token-count {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--dim);
    }

    #clear-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    #clear-btn:hover { color: var(--text); }

    .error-msg {
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--error);
    }

    .metrics {
      border-top: 1px solid var(--border);
      padding: 18px 24px;
      display: none;
    }
    .metrics.show { display: block; }

    .metrics-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .metric-key {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .metric-val .unit {
      font-size: 0.75rem;
      color: var(--dim);
      font-weight: 400;
      margin-left: 3px;
    }

    .finish-badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
    }
    .finish-badge.max { background: var(--dim); }

    .itl-panel {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: none;
    }
    .itl-panel.show { display: block; }

    .itl-head {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .itl-stats { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.05em; text-transform: none; }

    .itl-chart { width: 100%; }
    .itl-svg { width: 100%; height: auto; display: block; }
    .itl-svg .gridline { stroke: var(--border); stroke-width: 1; }
    .itl-svg .axis-label { fill: var(--dim); font-size: 11px; font-family: var(--mono); }
    .itl-svg .chart-area { fill: var(--accent); fill-opacity: 0.12; }
    .itl-svg .chart-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .itl-svg .chart-dot { fill: var(--accent); }
    .chart-empty { color: var(--dim); font-size: 0.85rem; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>molten</h1>
  <span>local model server</span>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <span id="theme-icon">☀</span>
    <span id="theme-label">light</span>
  </button>
</header>

<div class="card">
  <div class="input-box">
    <textarea id="prompt" placeholder="Enter your prompt…" rows="1"></textarea>
    <div class="input-actions">
      <div class="actions-right">
        <button class="icon-btn" id="voice-btn" onclick="toggleVoiceInput()" title="Voice input (Speech to text)" aria-label="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <button class="run-btn" id="run-btn" onclick="runGenerate()" disabled>Generate</button>
      </div>
    </div>
  </div>

  <div class="output-area">
    <div class="output-label">Response</div>
    <div id="output" class="empty"></div>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">idle</span>
    <span class="token-count" id="token-count"></span>
    <button id="clear-btn" onclick="clearOutput()">clear</button>
  </div>

  <div class="metrics" id="metrics">
    <div class="metrics-label">Observability</div>
    <div class="metrics-grid" id="metrics-grid"></div>

    <div class="itl-panel" id="itl-panel">
      <div class="itl-head">
        <span>Inter-token latency</span>
        <span class="itl-stats" id="itl-stats"></span>
      </div>
      <div class="itl-chart" id="itl-chart"></div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  let controller = null;
  let tokenCount = 0;
  let cursor = null;
  let itlSamples = [];

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (theme === 'dark') { icon.textContent = '☾'; label.textContent = 'dark'; }
    else { icon.textContent = '☀'; label.textContent = 'light'; }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('molten-theme', next);
  }

  // restore saved theme (default to light)
  applyTheme(localStorage.getItem('molten-theme') || 'light');

  function setStatus(state, msg) {
    const dot = document.getElementById('dot');
    const txt = document.getElementById('status-text');
    dot.className = 'dot' + (state === 'active' ? ' active' : state === 'error' ? ' error' : '');
    txt.textContent = msg;
  }

  function clearOutput() {
    const out = document.getElementById('output');
    out.textContent = '';
    out.classList.add('empty');
    document.getElementById('token-count').textContent = '';
    document.getElementById('metrics').classList.remove('show');
    document.getElementById('metrics-grid').innerHTML = '';
    document.getElementById('itl-panel').classList.remove('show');
    document.getElementById('itl-chart').innerHTML = '';
    document.getElementById('itl-stats').textContent = '';
    tokenCount = 0;
    itlSamples = [];
    setStatus('', 'idle');
    if (typeof autoResizePrompt === 'function') autoResizePrompt();
  }

  async function runGenerate() {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) return;

    if (controller) { controller.abort(); }
    controller = new AbortController();

    const out = document.getElementById('output');
    const btn = document.getElementById('run-btn');
    out.textContent = '';
    out.classList.remove('empty');
    tokenCount = 0;
    itlSamples = [];

    // add blinking cursor
    cursor = document.createElement('span');
    cursor.className = 'cursor';
    out.appendChild(cursor);

    btn.disabled = true;
    btn.textContent = 'Stop';
    btn.onclick = () => { controller.abort(); finalize('stopped'); };
    setStatus('active', 'generating…');

    try {
      const res = await fetch(`${API_BASE}/generate?text=${encodeURIComponent(prompt)}`, {
        signal: controller.signal
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        // keep the last (possibly incomplete) chunk in the buffer
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;

          // SSE lines are prefixed with "data: "
          const payload = trimmed.startsWith('data:')
            ? trimmed.slice(5).trim()
            : trimmed;
          if (!payload) continue;

          let event;
          try {
            event = JSON.parse(payload);
          } catch (e) {
            continue; // skip malformed/partial lines
          }

          if (event.event_type === 'TOKEN' && event.token != null) {
            out.insertBefore(document.createTextNode(event.token), cursor);
            tokenCount += event.token.length;
            document.getElementById('token-count').textContent = `${tokenCount} chars`;
            // collect inter-token latency (first token carries null = TTFT, skip it)
            if (event.itl != null) itlSamples.push(event.itl);
          } else if (event.event_type === 'COMPLETION') {
            renderMetrics(event);
            renderITLChart();
          }
        }
      }

      finalize('done');
    } catch (e) {
      if (e.name === 'AbortError') return;
      finalize('error');
      const err = document.createElement('div');
      err.className = 'error-msg';
      err.textContent = `Error: ${e.message}`;
      out.parentElement.appendChild(err);
      setStatus('error', 'failed');
    }
  }

  function renderMetrics(m) {
    const grid = document.getElementById('metrics-grid');
    grid.innerHTML = '';

    const fmt = (val, unit) => val == null
      ? '—'
      : (unit ? `${val}<span class="unit">${unit}</span>` : `${val}`);

    const rows = [
      ['TTFT', fmt(m.ttft != null ? m.ttft.toFixed(3) : null, 's')],
      ['Avg tok/s', fmt(m.average_tps != null ? m.average_tps.toFixed(2) : null)],
      ['Total time', fmt(m.total_generation_time != null ? m.total_generation_time.toFixed(2) : null, 's')],
      ['Prompt tokens', fmt(m.prompt_tokens)],
      ['Completion tokens', fmt(m.completion_tokens)],
      ['Finish reason', m.finish_reason
        ? `<span class="finish-badge ${m.finish_reason === 'MAX_TOKEN_REACHED' ? 'max' : ''}">${m.finish_reason}</span>`
        : '—'],
    ];

    for (const [key, val] of rows) {
      const cell = document.createElement('div');
      cell.className = 'metric';
      cell.innerHTML = `<div class="metric-key">${key}</div><div class="metric-val">${val}</div>`;
      grid.appendChild(cell);
    }

    document.getElementById('metrics').classList.add('show');
  }

  function renderITLChart() {
    const panel = document.getElementById('itl-panel');
    const chart = document.getElementById('itl-chart');
    const stats = document.getElementById('itl-stats');
    chart.innerHTML = '';

    const samples = itlSamples;
    if (!samples.length) {
      chart.innerHTML = '<div class="chart-empty">no inter-token latency samples</div>';
      panel.classList.add('show');
      return;
    }

    const n = samples.length;
    const min = Math.min(...samples);
    const max = Math.max(...samples);
    const avg = samples.reduce((a, b) => a + b, 0) / n;
    stats.textContent = `min ${min.toFixed(3)}s · avg ${avg.toFixed(3)}s · max ${max.toFixed(3)}s · ${n} samples`;

    // SVG layout
    const W = 640, H = 140, padL = 38, padR = 12, padT = 12, padB = 22;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const yMax = max === min ? max + 1e-6 : max;
    const yMin = Math.max(0, min - (yMax - min) * 0.1);
    const yRange = yMax - yMin || 1e-6;

    const x = (i) => padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const y = (v) => padT + innerH - ((v - yMin) / yRange) * innerH;

    // gridlines (4 horizontal)
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const gy = padT + (g / 4) * innerH;
      const gv = yMax - (g / 4) * yRange;
      grid += `<line class="gridline" x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" />`;
      grid += `<text class="axis-label" x="${padL - 6}" y="${gy + 3}" text-anchor="end">${gv.toFixed(2)}</text>`;
    }

    // x-axis labels (start / mid / end)
    const xLabels = `<text class="axis-label" x="${padL}" y="${H - 6}" text-anchor="middle">1</text>`
      + `<text class="axis-label" x="${padL + innerW / 2}" y="${H - 6}" text-anchor="middle">${Math.floor(n / 2) + 1}</text>`
      + `<text class="axis-label" x="${W - padR}" y="${H - 6}" text-anchor="middle">${n}</text>`;

    // line + area
    const pts = samples.map((v, i) => `${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
    const area = `M${x(0).toFixed(2)},${(padT + innerH).toFixed(2)} L${pts.replace(/ /g, ' L')} L${x(n - 1).toFixed(2)},${(padT + innerH).toFixed(2)} Z`;
    const line = `M${pts.replace(/ /g, ' L')}`;

    // dots (only when few enough to be readable)
    let dots = '';
    if (n <= 60) {
      dots = samples.map((v, i) => `<circle class="chart-dot" cx="${x(i).toFixed(2)}" cy="${y(v).toFixed(2)}" r="1.8" />`).join('');
    }

    chart.innerHTML = `<svg class="itl-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`
      + grid + xLabels
      + `<path class="chart-area" d="${area}" />`
      + `<path class="chart-line" d="${line}" />`
      + dots
      + `</svg>`;

    panel.classList.add('show');
  }

  const promptInput = document.getElementById('prompt');

  function updateButtonState() {
    const btn = document.getElementById('run-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const hasText = promptInput.value.trim().length > 0;

    if (!controller) {
      btn.disabled = !hasText;
    }

    if (voiceBtn) {
      voiceBtn.style.display = (hasText && !isListening) ? 'none' : 'inline-flex';
    }
  }

  function finalize(state) {
    if (cursor && cursor.parentNode) cursor.remove();
    cursor = null;
    const btn = document.getElementById('run-btn');
    btn.textContent = 'Generate';
    btn.onclick = runGenerate;
    controller = null;
    updateButtonState();
    if (state === 'done') {
      setStatus('', 'done');
      // auto-scroll to the observability panel so metrics are visible
      const metrics = document.getElementById('metrics');
      if (metrics.classList.contains('show')) {
        metrics.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } else if (state === 'stopped') {
      setStatus('', 'stopped');
    }
  }

  function autoResizePrompt() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.max(44, promptInput.scrollHeight) + 'px';
    updateButtonState();
  }

  promptInput.addEventListener('input', autoResizePrompt);
  autoResizePrompt();

  // Voice Input (Speech to Text) Handler
  let recognition = null;
  let isListening = false;

  function toggleVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voiceBtn = document.getElementById('voice-btn');

    if (!SpeechRecognition) {
      alert('Speech recognition is not supported in your current browser. Please use Google Chrome, Microsoft Edge, or Safari.');
      return;
    }

    if (isListening) {
      if (recognition) recognition.stop();
      return;
    }

    try {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || 'en-US';

      let baseText = promptInput.value;
      if (baseText && !baseText.endsWith(' ')) baseText += ' ';

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('recording');
        voiceBtn.title = 'Listening… Click to stop';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        promptInput.value = baseText + transcript;
        autoResizePrompt();
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        stopVoiceInput();
      };

      recognition.onend = () => {
        stopVoiceInput();
      };

      recognition.start();
    } catch (err) {
      console.error('Failed to start speech recognition:', err);
      stopVoiceInput();
    }
  }

  function stopVoiceInput() {
    isListening = false;
    const voiceBtn = document.getElementById('voice-btn');
    if (voiceBtn) {
      voiceBtn.classList.remove('recording');
      voiceBtn.title = 'Voice input (Speech to text)';
    }
    updateButtonState();
  }

  // Ctrl+Enter to submit
  promptInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runGenerate();
  });
</script>

</body>
</html>
